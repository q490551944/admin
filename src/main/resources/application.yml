server:
  port: 8090
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${CHAT_SESSION_COOKIE_SECURE:false}
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      security:
        protocol:
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      security:
        protocol: SASL_PLAINTEXT
      properties:
        sasl:
          mechanism: PLAIN
          jaas:
            config: org.apache.kafka.common.security.plain.PlainLoginModule required username='admin' password='123456';
    consumer:
      group-id: test-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      security:
        protocol: SASL_PLAINTEXT
      properties:
        sasl:
          mechanism: PLAIN
          jaas:
            config: org.apache.kafka.common.security.plain.PlainLoginModule required username='admin' password='123456';
  application:
    name: admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  cloud:
    inetutils:
      ignored-interfaces:
        - .*VMware
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:https://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:123456}
    restclient:
      ssl:
        bundle: elasticsearch
  ssl:
    bundle:
      pem:
        elasticsearch:
          truststore:
            # Trust this ES instance's CA; override the location when deploying elsewhere.
            certificate: ${ELASTICSEARCH_CA_CERT:file:C:/workerspace/elasticsearch-9.2.2/config/certs/http_ca.crt}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
logging:
  level:
    com.hpj.admin.modules.sys.mapper: debug
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.hpj.admin.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
mybatis-plus:
  configuration:
    configuration-factory: java.lang.Object
arthas:
  tunnel-server: ws://localhost:7777/ws
  app-name: ${spring.application.name}
  telnet-port: 0
chat:
  enabled: ${CHAT_ENABLED:true}
  security:
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:}
    allow-legacy-des-passwords: ${CHAT_ALLOW_LEGACY_DES_PASSWORDS:false}
    protect-legacy-endpoints: ${CHAT_PROTECT_LEGACY_ENDPOINTS:false}
  attachment:
    endpoint: ${CHAT_ATTACHMENT_ENDPOINT:http://localhost:9000}
    bucket: ${CHAT_ATTACHMENT_BUCKET:chat-attachments}
    access-key: ${CHAT_ATTACHMENT_ACCESS_KEY:}
    secret-key: ${CHAT_ATTACHMENT_SECRET_KEY:}
    secure: ${CHAT_ATTACHMENT_SECURE:false}
    unattached-retention: ${CHAT_ATTACHMENT_UNATTACHED_RETENTION:24h}
