chat:
  enabled: true
spring:
  datasource:
    url: jdbc:h2:mem:chat_http;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    type: com.zaxxer.hikari.HikariDataSource
  flyway:
    locations: classpath:db/migration
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    root: WARN
